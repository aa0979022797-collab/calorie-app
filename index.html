<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拍照算熱量</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f0f2f5;padding:16px;display:flex;flex-direction:column;align-items:center}
.c{max-width:420px;width:100%}
h1{text-align:center;font-size:1.4rem;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.title{font-weight:700;font-size:.9rem;margin-bottom:8px}
input,button{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:.9rem;margin-bottom:8px}
button{background:#4CAF50;color:#fff;border:none;font-weight:600;cursor:pointer}
button.blue{background:#2196F3}
button.orange{background:#FF9800}
button.red{background:#f44336}
.row{display:flex;gap:8px}
.row input{flex:1}
.tabs{display:flex;margin-bottom:10px}
.tabs button{flex:1;border-radius:0;background:#e0e0e0;color:#666;margin:0}
.tabs button.on{background:#4CAF50;color:#fff}
.hide{display:none}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.history-item .del{background:none;border:none;color:red;width:auto;padding:4px 8px}
</style>
</head>
<body>
<div class="c">
<h1>🥗 拍照計算熱量</h1>

<div class="card">
<div class="title">🎯 每日目標</div>
<div class="row">
<input type="number" id="goalInput" value="2000" style="width:80px;flex:none">
<span style="line-height:44px">大卡</span>
<button id="btnSaveGoal" style="width:60px;flex:none">儲存</button>
</div>
<p>今日剩餘：<b id="remainCal" style="font-size:1.4rem;color:#2e7d32">2000</b> 大卡</p>
<p style="font-size:.8rem;color:#888">已攝取 <b id="todayTotal">0</b> 大卡</p>
</div>

<div class="card">
<div class="title">🔑 API Key</div>
<input type="password" id="apiKey" placeholder="貼上 Gemini API Key">
</div>

<div class="tabs">
<button id="tabPhoto" class="on">📷 拍照</button>
<button id="tabManual">✏️ 手動</button>
</div>

<div id="photoMode">
<div class="row">
<button id="btnCamera">📷 拍照</button>
<button id="btnGallery" class="blue">🖼️ 選照片</button>
</div>
<input type="file" id="fileInput" accept="image/*" class="hide">
<img id="previewImg" style="width:100%;border-radius:12px;display:none;margin-bottom:8px">
<div id="loadingMsg" style="text-align:center;display:none;padding:20px">AI 辨識中...</div>
<div id="debugMsg" style="background:#fff3e0;padding:10px;border-radius:10px;display:none;font-size:.7rem;margin-bottom:8px"></div>
<div id="resultBox" style="display:none;background:#fff;border-radius:16px;padding:14px">
<p><b id="foodName"></b></p>
<p style="font-size:2rem;font-weight:800;color:#e65100"><span id="calVal">0</span> 大卡</p>
<div class="row" style="margin:8px 0">
<div style="flex:1;text-align:center;background:#f5f5f5;padding:8px;border-radius:8px"><b id="proteinVal">0</b><br><small>蛋白質g</small></div>
<div style="flex:1;text-align:center;background:#f5f5f5;padding:8px;border-radius:8px"><b id="fatVal">0</b><br><small>脂肪g</small></div>
<div style="flex:1;text-align:center;background:#f5f5f5;padding:8px;border-radius:8px"><b id="carbsVal">0</b><br><small>碳水g</small></div>
</div>
<button id="btnAdd">✅ 加入今日紀錄</button>
</div>
</div>

<div id="manualMode" class="card hide">
<input type="text" id="mFood" placeholder="食物名稱">
<div class="row"><input type="number" id="mCal" placeholder="熱量(大卡)"><input type="number" id="mPro" placeholder="蛋白質(g)"></div>
<div class="row"><input type="number" id="mFat" placeholder="脂肪(g)"><input type="number" id="mCarbs" placeholder="碳水(g)"></div>
<button id="btnManualAdd" class="orange">✅ 加入今日紀錄</button>
</div>

<div class="card">
<div class="title">📋 今日紀錄</div>
<div id="historyList"><p style="color:#bbb;text-align:center">尚無紀錄</p></div>
<button id="btnReset" class="red" style="margin-top:8px">清空今日紀錄</button>
</div>
</div>

<script>
(function(){
function $(id){return document.getElementById(id)}

var apiKey=$('apiKey'),fileInput=$('fileInput'),previewImg=$('previewImg');
var loadingMsg=$('loadingMsg'),debugMsg=$('debugMsg'),resultBox=$('resultBox');
var latestResult=null;

// 頁籤
$('tabPhoto').onclick=function(){
this.className='on';$('tabManual').className='';
$('photoMode').className='';$('manualMode').className='card hide';
};
$('tabManual').onclick=function(){
this.className='on';$('tabPhoto').className='';
$('photoMode').className='hide';$('manualMode').className='card';
};

// 目標儲存
$('btnSaveGoal').onclick=function(){
var v=parseInt($('goalInput').value)||2000;
$('goalInput').value=v;
localStorage.setItem('goal',v);
updateRemain();
};

// 手動新增
$('btnManualAdd').onclick=function(){
var f=$('mFood').value.trim();
var c=parseInt($('mCal').value)||0;
if(!f){alert('請輸入食物名稱');return;}
if(c<=0){alert('請輸入熱量');return;}
addRecord(f,c,parseInt($('mPro').value)||0,parseInt($('mFat').value)||0,parseInt($('mCarbs').value)||0);
$('mFood').value='';$('mCal').value='';$('mPro').value='';$('mFat').value='';$('mCarbs').value='';
};

// 拍照
$('btnCamera').onclick=function(){
fileInput.setAttribute('capture','environment');
fileInput.click();
};
$('btnGallery').onclick=function(){
fileInput.removeAttribute('capture');
fileInput.click();
};
fileInput.onchange=function(e){
var f=e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(ev){
var img=new Image();
img.onload=function(){
var c=document.createElement('canvas'),s=1024,w=img.width,h=img.height;
if(w>h&&w>s){h=Math.round(h*s/w);w=s}else if(h>s){w=Math.round(w*s/h);h=s}
c.width=w;c.height=h;
c.getContext('2d').drawImage(img,0,0,w,h);
var b64=c.toDataURL('image/jpeg',0.75);
previewImg.src=b64;previewImg.style.display='block';
resultBox.style.display='none';debugMsg.style.display='none';
analyze(b64);
};
img.src=ev.target.result;
};
r.readAsDataURL(f);
};

// AI 分析
async function analyze(b64){
var key=apiKey.value.trim();
if(!key){alert('請先輸入 API Key');return;}
loadingMsg.style.display='block';resultBox.style.display='none';debugMsg.style.display='none';
try{
var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key;
var b64d=b64.split(',')[1];
var mt=b64.match(/data:(image\/\w+);/)?.[1]||'image/jpeg';
var body={contents:[{parts:[
{text:'分析這張食物照片。只回一個JSON：{"food":"食物名","calories":熱量,"protein":蛋白質,"fat":脂肪,"carbs":碳水}。都是整數，不要其他文字。'},
{inline_data:{mime_type:mt,data:b64d}}
]}],generationConfig:{temperature:0,maxOutputTokens:200}};
var resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
var data=await resp.json();
if(!resp.ok)throw new Error(data.error?.message||'錯誤');
var txt=data.candidates?.[0]?.content?.parts?.[0]?.text;
if(!txt)throw new Error('無回覆');
debugMsg.style.display='block';
debugMsg.innerHTML='<b>AI回覆：</b><br>'+txt.replace(/</g,'&lt;');

// 解析
var cleaned=txt.trim().replace(/```json\s*/gi,'').replace(/```/g,'').trim();
var si=cleaned.indexOf('{'),ei=cleaned.lastIndexOf('}');
var jp=(si!==-1&&ei!==-1)?cleaned.substring(si,ei+1):cleaned;
var result;
try{result=JSON.parse(jp)}catch(e){result=null}
if(!result||!result.calories||result.calories===0){
var fm=jp.match(/"food"\s*:\s*"([^"]+)"/);
var cm=jp.match(/"calories"\s*:\s*"?\s*(\d+)/);
var pm=jp.match(/"protein"\s*:\s*"?\s*(\d+)/);
var ftm=jp.match(/"fat"\s*:\s*"?\s*(\d+)/);
var cbm=jp.match(/"carbs"\s*:\s*"?\s*(\d+)/);
result={
food:fm?fm[1]:'未知',
calories:cm?parseInt(cm[1]):0,
protein:pm?parseInt(pm[1]):0,
fat:ftm?parseInt(ftm[1]):0,
carbs:cbm?parseInt(cbm[1]):0
};
}
latestResult=result;
$('foodName').textContent=result.food||'未知';
$('calVal').textContent=result.calories||0;
$('proteinVal').textContent=result.protein||0;
$('fatVal').textContent=result.fat||0;
$('carbsVal').textContent=result.carbs||0;
resultBox.style.display='block';
}catch(err){
alert('錯誤：'+err.message);
}finally{
loadingMsg.style.display='none';
}
}

// 加入紀錄
$('btnAdd').onclick=function(){
if(!latestResult)return;
addRecord(latestResult.food,latestResult.calories,latestResult.protein,latestResult.fat,latestResult.carbs);
previewImg.style.display='none';resultBox.style.display='none';debugMsg.style.display='none';
latestResult=null;
};

function addRecord(food,cal,pro,fat,carbs){
var recs=getRecords();
recs.push({food:food,calories:cal,protein:pro,fat:fat,carbs:carbs});
saveRecords(recs);
renderHistory();
updateRemain();
}

function getKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function getRecords(){
var today=getKey();
var sd=localStorage.getItem('rd');
if(sd!==today){localStorage.setItem('rd',today);return[]}
var r=localStorage.getItem('recs');
return r?JSON.parse(r):[];
}
function saveRecords(r){localStorage.setItem('rd',getKey());localStorage.setItem('recs',JSON.stringify(r))}
function updateRemain(){
var goal=parseInt($('goalInput').value)||2000;
var recs=getRecords();
var sum=recs.reduce(function(a,b){return a+(b.calories||0)},0);
var rem=goal-sum;
$('todayTotal').textContent=sum;
var rc=$('remainCal');
rc.textContent=rem>=0?rem:0;
rc.style.color=sum/goal<0.8?'#2e7d32':sum/goal<1?'#e65100':'#c62828';
}
function renderHistory(){
var recs=getRecords();
var h=$('historyList');
h.innerHTML='';
if(recs.length===0){h.innerHTML='<p style="color:#bbb;text-align:center">尚無紀錄</p>';return}
recs.forEach(function(r,i){
var d=document.createElement('div');
d.className='history-item';
d.innerHTML='<div><b>'+r.food+'</b><br><small>蛋白'+r.protein+'g 脂肪'+r.fat+'g 碳水'+r.carbs+'g</small></div><div><b>'+r.calories+' 大卡</b> <button class="del">✕</button></div>';
d.querySelector('.del').onclick=function(){
var recs2=getRecords();
recs2.splice(i,1);
saveRecords(recs2);
renderHistory();
updateRemain();
};
h.appendChild(d);
});
}
$('btnReset').onclick=function(){if(confirm('清空？')){saveRecords([]);renderHistory();updateRemain()}};

// 載入
var sk=localStorage.getItem('apikey');if(sk)apiKey.value=sk;
apiKey.oninput=function(){localStorage.setItem('apikey',this.value)};
var sg=localStorage.getItem('goal');if(sg)$('goalInput').value=sg;
updateRemain();
renderHistory();
})();
</script>
</body>
</html>
